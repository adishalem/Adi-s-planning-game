  <div class="city" id="cityname"><b>עיר</b><small></small></div>
  <div class="clock" aria-live="polite"><b id="clk">06:30</b><span id="phase">העיר מתעוררת</span></div>
  <div class="row"><div class="seg" role="group" aria-label="תאורה"><button type="button" id="t-day" aria-pressed="true">יום</button><button type="button" id="t-dusk" aria-pressed="false">שקיעה</button><button type="button" id="t-night" aria-pressed="false">לילה</button></div></div>
  <div class="row"><button type="button" class="btn" id="street">מבט רחוב</button></div>
  <div class="row"><button type="button" class="btn pri" id="regen">עיר חדשה</button><button type="button" class="btn" id="region">האזור</button><button type="button" class="btn" id="spin" aria-pressed="false">סיבוב</button><button type="button" class="btn" id="fast" aria-pressed="false">זמן מהיר</button></div>
  <p class="help">גרירה: סיבוב והטיה. גלגלת או צביטה: זום. כפתור ימני, שתי אצבעות או החצים במקלדת: הזזה.</p>

  var cdx=p.x-cam.position.x,cdz=p.z-cam.position.z,far=cdx*cdx+cdz*cdz>90000;if(!p.vis||far){if(!p._hid){P.forEach(function(q){if(q.pair){q.im.setMatrixAt(i*2,ZERO);q.im.setMatrixAt(i*2+1,ZERO)}else q.im.setMatrixAt(i,ZERO)});p._hid=true}return}
  var walking=p.st==='walk'&&!p.scoot;if(!walking&&!p.scoot&&!p._hid&&(FRAME+i)%4)return;p._hid=false;
  var s=p.sc,y,ph=p.ph;
  if(p.sit)y=p.y+.47-.93*s;else y=H(p.x,p.z)+sidewalkLift(p.x,p.z)+(walking?Math.abs(Math.cos(ph))*.025*s:0)+(p.scoot?.13:0);
  _p.set(p.x,y,p.z);_q.setFromAxisAngle(_y,p.yaw+(p.sit?Math.sin(t*.9+i)*.06:0));_s.set(s,s,s);_m.compose(_p,_q,_s);
  var idle=Math.sin(t*1.2+i)*.04;
  for(var k=0;k<2;k++){var sg=k?1:-1,fi=ph+(k?Math.PI:0),hip,knee,sh,el;
   if(p.sit){hip=-1.5;knee=1.5;sh=-.45+idle;el=-1}
   else if(p.scoot){hip=k?.12:-.12;knee=.08;sh=-.85;el=-.45}
   else if(walking){hip=.5*Math.sin(fi);knee=.9*Math.max(0,-Math.cos(fi));sh=-.42*Math.sin(fi);el=-.28-.25*Math.max(0,-Math.sin(fi))}
   else{hip=0;knee=0;sh=idle*sg;el=-.15}
   if(p.stroller&&!p.sit){sh=-.95;el=-.45}
   if(p.o.phone&&k===1&&!p.sit){sh=-.35;el=-1.55}
   seg(_m,_th,sg*.085,.93,hip,0);seg(_th,_sh,0,-.44,knee,0);seg(_m,_ua,sg*.2,1.44,sh,sg*.06);seg(_ua,_fa,0,-.29,el,0);
   P.forEach(function(q){var sgm=q.seg;if(sgm==='root')return;var mm=sgm==='thigh'?_th:sgm==='shin'?_sh:sgm==='uarm'?_ua:_fa;
    if(sgm==='farmR'){if(k===1)q.im.setMatrixAt(i,_fa);return}if(sgm==='farmL'){if(k===0)q.im.setMatrixAt(i,_fa);return}q.im.setMatrixAt(i*2+k,mm)})}
  P.forEach(function(q){if(q.seg==='root')q.im.setMatrixAt(i,_m)})});
 PM.forEach(function(q){q.im.instanceMatrix.needsUpdate=true});
 if(DM){DOGS.forEach(function(d,i){var ddx=d.x-cam.position.x,ddz=d.z-cam.position.z;if(!d.vis||ddx*ddx+ddz*ddz>90000){DM.body.setMatrixAt(i,ZERO);DM.head.setMatrixAt(i,ZERO);for(var k=0;k<4;k++)DM.leg.setMatrixAt(i*4+k,ZERO);return}
   var moving=d.owner.st==='walk';_p.set(d.x,H(d.x,d.z)+sidewalkLift(d.x,d.z),d.z);_q.setFromAxisAngle(_y,d.yaw);_s.set(d.s,d.s,d.s);_m.compose(_p,_q,_s);DM.body.setMatrixAt(i,_m);DM.head.setMatrixAt(i,_m);
   [[-.08,.2],[.08,.2],[-.08,-.2],[.08,-.2]].forEach(function(o,k){var a=moving?Math.sin(d.ph+(k===0||k===3?0:Math.PI))*.6:0;_l.multiplyMatrices(_m,_t.makeTranslation(o[0],.3,o[1]));_l.multiply(_r.makeRotationX(a));DM.leg.setMatrixAt(i*4+k,_l)})});
  DM.body.instanceMatrix.needsUpdate=DM.head.instanceMatrix.needsUpdate=DM.leg.instanceMatrix.needsUpdate=true}}

function isRoad(x,y){return x>=0&&y>=0&&x<N&&y<N&&G[y][x]==='R'}
function nearRoad(tx,ty){var best=null;ROWS.forEach(function(r){var d=Math.abs(ty-r);if(!best||d<best.d)best={x:tx,y:r,d:d,h:1}});COLS.forEach(function(c){var d=Math.abs(tx-c);if(d<best.d)best={x:c,y:ty,d:d,h:0}});return best}
function bfs(a,b){var key=function(x,y){return y*N+x},prev={},q=[[a.x,a.y]],seen={};seen[key(a.x,a.y)]=1;
 while(q.length){var c=q.shift();if(c[0]===b.x&&c[1]===b.y)break;[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(d){var nx=c[0]+d[0],ny=c[1]+d[1],k=key(nx,ny);if(isRoad(nx,ny)&&!seen[k]){seen[k]=1;prev[k]=c;q.push([nx,ny])}})}
 var path=[[b.x,b.y]],cur=[b.x,b.y],guard=0;while(!(cur[0]===a.x&&cur[1]===a.y)&&guard++<200){cur=prev[key(cur[0],cur[1])];if(!cur)return [[a.x,a.y],[b.x,b.y]];path.unshift(cur)}
 return path.filter(function(p,i){if(i===0||i===path.length-1)return true;var a1=path[i-1],c1=path[i+1];return !((a1[0]===p[0]&&p[0]===c1[0])||(a1[1]===p[1]&&p[1]===c1[1]))})}
function door(t,r){var w=wpos(t.x,t.y);return [w[0]+Math.sign(r.x-t.x)*4.7,w[1]+Math.sign(r.y-t.y)*4.7]}
function route(from,to){var a=nearRoad(from.x,from.y),b=nearRoad(to.x,to.y);var side=(a.h?Math.sign(from.y-a.y):Math.sign(from.x-a.x))||1;var pts=[door(from,a)];
 bfs(a,b).forEach(function(t){var w=wpos(t[0],t[1]);pts.push([w[0]+side*4.4,w[1]+side*4.4])});pts.push(door(to,b));return pts}
function tilesOf(re,maxD){var out=[];for(var y=0;y<N;y++)for(var x=0;x<N;x++)if(re.test(G[y][x])&&nearRoad(x,y).d<=(maxD||9))out.push({x:x,y:y});return out}
function nearest(list,t){var b=null,bd=1e9;list.forEach(function(s){var d=Math.abs(s.x-t.x)+Math.abs(s.y-t.y)+Math.random()*3;if(d<bd){bd=d;b=s}});return b}
// ---------- daily clock ----------
var PHASES=[[0,'העיר מתעוררת. הראשונים כבר בדרך לעבודה'],[7*60,'בוקר: ילדים בדרך לגן ולבית הספר, הורים בדרך לעבודה'],[9*60,'שעות הבוקר: קניות במרכז, בתי הקפה מתמלאים'],[12*60+50,'סוף יום הלימודים: איסוף מהגן וחזרה הביתה'],[16*60,'שעת העומס: כולם חוזרים מהעבודה באותו כביש'],[18*60+30,'ערב: מרכז מסחרי ובתי קפה'],[21*60,'לילה: העיר נרגעת']];
function rushK(){var h=CLOCK/60;return (h>7&&h<8.6)||(h>16&&h<18)?.55:1}
function hhmm(m){var h=Math.floor(m/60),mm=Math.floor(m%60);return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm}
var lastPh=-1,clkEl=document.getElementById('clk'),phEl=document.getElementById('phase'),lastMin=-1;
function tickClock(dt){CLOCK+=dt*SPEED;if(CLOCK>=22*60){CLOCK=6*60;resetDay()}var mm=Math.floor(CLOCK);if(mm!==lastMin){lastMin=mm;clkEl.textContent=hhmm(mm)}
 var ph=0;PHASES.forEach(function(p,i){if(CLOCK>=p[0])ph=i});if(ph!==lastPh){lastPh=ph;phEl.textContent=PHASES[ph][1]}}
// ---------- lighting presets ----------
var TIME='day',TIMES={day:{bg:['#7fb6e6','#dcebf6'],sun:[0xffeccc,1.3],hemi:.55,pos:[110,150,60],exp:1.0,lamps:0,win:0,fog:0xbcd6ec},
 dusk:{bg:['#34477a','#f4a25a'],sun:[0xffa968,1.05],hemi:.36,pos:[170,50,-50],exp:1,lamps:.5,win:.45,fog:0xd39a70},
 night:{bg:['#050c19','#16294b'],sun:[0x8aa6ff,.22],hemi:.13,pos:[-60,140,90],exp:1.1,lamps:1,win:1,fog:0x0c1830}};
function applyTime(k){TIME=k;var t=TIMES[k];sun.position.set(t.pos[0]*1.6,t.pos[1]*1.6,t.pos[2]*1.6);if(S.background&&S.background.dispose)S.background.dispose();S.background=canv(4,256,function(g,w,h){var gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,t.bg[0]);gr.addColorStop(1,t.bg[1]);g.fillStyle=gr;g.fillRect(0,0,w,h)});
 S.fog=new THREE.Fog(t.fog,950,2800);S.fog.color.convertSRGBToLinear();sun.color.setHex(t.sun[0]);sun.intensity=t.sun[1];sun.position.set(t.pos[0],t.pos[1],t.pos[2]);hemi.intensity=t.hemi;R.toneMappingExposure=t.exp;
 emissiveMats.forEach(function(m){m.emissiveIntensity=t.win*.95});M.bulb.color.setHex(t.lamps?0xffe2a0:0x9aa0a6).convertSRGBToLinear();
 ['day','dusk','night'].forEach(function(x){document.getElementById('t-'+x).setAttribute('aria-pressed',String(x===k))})}
// ---------- camera moves ----------
var fly=null;
function flyTo(tx,tz,dist,pol){var tgt=new THREE.Vector3(tx,H(tx,tz),tz),dir=cam.position.clone().sub(ctl.target).setY(0).normalize();var pos=tgt.clone().add(dir.multiplyScalar(dist*Math.sin(pol))).setY(tgt.y+dist*Math.cos(pol));fly={t0:performance.now(),a:cam.position.clone(),b:pos,ta:ctl.target.clone(),tb:tgt}}
function camStep(now){if(fly){var k=Math.min(1,(now-fly.t0)/1400),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;cam.position.lerpVectors(fly.a,fly.b,e);ctl.target.lerpVectors(fly.ta,fly.tb,e);if(k>=1)fly=null}}
// ---------- loop ----------
function resize(){var w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
window.addEventListener('resize',resize);resize();
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches,last=performance.now();
function frame(dt,now){if(!reduce){tickClock(dt);moveVehicles(dt);moveSmoke(dt);stepPeople(dt)}else tickClock(dt);drawPeople(now/1000);camStep(now);ctl.update();R.render(S,cam)}
function loop(now){var dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;frame(dt,now);requestAnimationFrame(loop)}
function setP(id,on){document.getElementById(id).setAttribute('aria-pressed',String(on))}
document.getElementById('regen').addEventListener('click',build);
['day','dusk','night'].forEach(function(k){document.getElementById('t-'+k).addEventListener('click',function(){applyTime(k)})});
document.getElementById('spin').addEventListener('click',function(){ctl.autoRotate=!ctl.autoRotate;ctl.autoRotateSpeed=.6;setP('spin',ctl.autoRotate)});
document.getElementById('region').addEventListener('click',function(){flyTo(0,0,980,.95)});
document.getElementById('fast').addEventListener('click',function(){SPEED=SPEED===1.5?6:1.5;setP('fast',SPEED>1.5)});
document.getElementById('street').addEventListener('click',function(){var u=null;for(var y=0;y<N&&!u;y++)for(var x=0;x<N;x++)if(G[y][x]==='U'){u=wpos(x,y);break}u=u||[0,0];flyTo(u[0]+6,u[1]+6,34,1.15)});
build();requestAnimationFrame(loop);
window.__city3d={S:S,R:R,sp:function(d){stepPeople(d)},dp:function(t){drawPeople(t)},mv:function(d){moveVehicles(d)},build:build,applyTime:applyTime,frame:frame,flyTo:flyTo,cam:cam,ctl:ctl,PPL:function(){return PPL},setClock:function(m){CLOCK=m},G:function(){return G}};
})();
